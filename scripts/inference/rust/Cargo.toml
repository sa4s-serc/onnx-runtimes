[package]
name = "onnx_inference"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "onnx_inference"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-21"] }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
# npy crate not used (custom reader in main.rs)
